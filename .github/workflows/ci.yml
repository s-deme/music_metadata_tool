name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build app container
        run: docker compose build

      - name: Run test suite
        run: ./bin/test

  reverse-spec:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build app container
        run: docker compose build

      - name: Regenerate reverse spec markdown
        run: ./bin/reverse-spec-md

      - name: Check committed reverse spec markdown
        run: git diff --exit-code -- docs/reverse-spec/user-spec.md
